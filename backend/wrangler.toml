# ============================================================================
# Control BPH — wrangler.toml (backend, Cloudflare Workers)
# ============================================================================
# Reemplazá los IDs reales al crear cada recurso:
#   wrangler hyperdrive create HYPERDRIVE --connection-string="postgresql://..."
#   wrangler kv namespace create RATE_LIMIT
#   wrangler r2 bucket create bph-respaldos
#
# Secretos (NUNCA en este archivo — se commitea al repo):
#   wrangler secret put JWT_SECRET
#   wrangler secret put BACKUP_ENCRYPTION_KEY
#   wrangler secret put CRON_TOKEN
# ============================================================================

name = "bph-backend"
main = "src/worker.js"
workers_dev = true
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run prisma:generate"

# Ruta pública del Worker sobre tu dominio propio (requiere dominio agregado
# a Cloudflare — ver README.md, sección "Dominio y cookies").
# routes = [
#   { pattern = "api.tudominio.com/*", zone_name = "tudominio.com" }
# ]

# Conexión pooled a Neon — binding renombrado a HYPERDRIVE (sin guiones)
# para ser accesible directamente como env.HYPERDRIVE desde el código.
# Crear con: wrangler hyperdrive create bph-hyperdrive --connection-string="postgresql://..."
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "065fba749b594043b25549d5b25d7ab2"

# Namespace de KV para el rate limiting de login
# Crear con: wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d5e2390bebc749dcabd724a71809a12c"

# Bucket R2 para respaldos cifrados históricos
# Crear con: wrangler r2 bucket create bph-respaldos
[[r2_buckets]]
binding = "RESPALDOS"
bucket_name = "bph-respaldos"

# Cron Trigger — respaldo automático todos los días a las 06:00 UTC
[triggers]
crons = ["0 6 * * *"]

# Variables NO sensibles únicamente.
# JWT_SECRET, BACKUP_ENCRYPTION_KEY y CRON_TOKEN van con:
#   wrangler secret put JWT_SECRET
#   wrangler secret put BACKUP_ENCRYPTION_KEY
#   wrangler secret put CRON_TOKEN
[vars]
FRONTEND_URL = "http://localhost:5173,https://frontend.bph-backend-esqueleto.workers.dev"
COOKIE_DOMAIN = ".bph-backend-esqueleto.workers.dev"
JWT_EXPIRATION_SECONDS = "28800"
NODE_ENV = "production"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
